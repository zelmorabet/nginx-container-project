<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A configurable static Nginx container demo">
  <title>Nginx Container Demo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">NGINX · DOCKER · GITHUB ACTIONS</p>
    <h1 id="app-name">Nginx Container Demo</h1>
    <p class="lead">Your static application is running inside an Nginx container.</p>
    <dl>
      <div><dt>Version</dt><dd id="app-version">Loading…</dd></div>
      <div><dt>Environment</dt><dd id="app-environment">Loading…</dd></div>
      <div><dt>Container port</dt><dd id="app-port">80</dd></div>
    </dl>
    <p id="status" class="status">Loading application configuration…</p>
  </main>
  <script>
    fetch('/config.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(config => {
        document.getElementById('app-name').textContent = config.application.name;
        document.title = config.application.name;
        document.getElementById('app-version').textContent = config.application.version;
        document.getElementById('app-environment').textContent = config.application.environment;
        document.getElementById('app-port').textContent = config.docker.port;
        document.getElementById('status').textContent = 'Configuration loaded successfully.';
      })
      .catch(error => {
        document.getElementById('status').textContent = `Could not load config.json: ${error.message}`;
      });
  </script>
</body>
</html>
